name: Status
run-name: Status
on:
  push:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the current branch
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache ./static/processed_images
        id: dir-processed-images
        uses: actions/cache@v5
        with:
          path: ./static/processed_images
          key: processed-images-${{ hashFiles('./static/img/**') }}
          restore-keys: |
            processed-images-

      - uses: taiki-e/install-action@v2
        with:
          tool: zola@0.21.0

      - name: ls before
        run: ls -alh ./static/processed_images

        # Lol the build regenerates all of the processed images.
        # Need to figure out how to preprocess conditionally.
        #
        # From ls before build (with cache)
        # 2026-05-21T00:18:50.5921730Z -rw-r--r-- 1 runner runner  380K May 20 23:45 2026-03-26-flight-back-home.04611ed68874a73b.webp
        # 2026-05-21T00:18:50.5922233Z -rw-r--r-- 1 runner runner  3.1M May 20 23:45 2026-03-26-flight-back-home.5aeb29ef64603854.webp
        # ...
        # From ls after build
        # 2026-05-21T00:21:06.5131629Z -rw-r--r-- 1 runner runner  380K May 21 00:20 2026-03-26-flight-back-home.04611ed68874a73b.webp
        # 2026-05-21T00:21:06.5132177Z -rw-r--r-- 1 runner runner  3.1M May 21 00:19 2026-03-26-flight-back-home.5aeb29ef64603854.webp

      - name: Build the website
        run: zola build --minify

      - name: ls after
        run: ls -alh ./static/processed_images

      - name: Save cache
        uses: actions/cache/save@v5
        with:
          path: ./static/processed_images
          key: processed-images-${{ hashFiles('./static/img/**') }}
